name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("tidyverse", "broom", "ggdag", "dagitty"))'

      - name: Render assessment
        run: quarto render session3_assessment.qmd --to html

      - name: Verify rendered HTML
        run: test -s session3_assessment.html
